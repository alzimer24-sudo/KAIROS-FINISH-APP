name: KAIROS FINISH Android APK (prova)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-finish/**'
      - '.github/workflows/build-kairos-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p android-finish --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KAIROS-FINISH-V12-TEST-APK
          path: android-finish/app/build/outputs/apk/debug/app-debug.apk

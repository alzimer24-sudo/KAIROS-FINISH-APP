name: KAIROS START Android APK (prova)
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-start/**'
      - '.github/workflows/build-kairos-start-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Include KAIROS icon
        run: |
          mkdir -p android-start/app/src/main/res/drawable-nodpi
          cp kairos-icon-512.png android-start/app/src/main/res/drawable-nodpi/kairos_icon.png
      - name: Build Android APK
        run: gradle -p android-start --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KAIROS-START-TEST-APK
          path: android-start/app/build/outputs/apk/debug/app-debug.apk

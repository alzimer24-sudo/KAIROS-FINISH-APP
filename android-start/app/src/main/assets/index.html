<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><title>KAIROS START</title>
<style>
*{box-sizing:border-box}html{font-family:system-ui,Roboto,Arial,sans-serif;background:#050505;color:#fff}body{margin:0}
header{padding:9px 12px;border-bottom:3px solid #ffe600;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{margin:0;font-size:21px}
main{padding:8px;max-width:700px;margin:auto}section{background:#101010;border:2px solid #fff;border-radius:14px;padding:10px;margin:8px 0}
h2{font-size:15px;color:#ffe600;margin:0 0 7px}button,input{width:100%;min-height:50px;border-radius:10px;font:inherit;touch-action:manipulation}
input{border:2px solid #fff;background:#000;color:#fff;font-size:36px;font-weight:900;text-align:center}
button{margin-top:7px;background:#ffe600;color:#000;border:2px solid #ffe600;font-size:18px;font-weight:900}
button.green{background:#12e779;border-color:#fff;color:#000}button:disabled,button.green:disabled{background:#444;border-color:#777;color:#fff}
.athlete{margin-top:8px;border:2px solid #ffe600;border-radius:10px;padding:8px;background:#000;text-align:center}
.label{font-size:13px;color:#ffe600;font-weight:900}.name{font-size:clamp(24px,7vw,40px);font-weight:950;overflow-wrap:anywhere;min-height:32px}.athlete-status{font-size:13px;color:#ffe600;font-weight:800}
.status{font-size:12px;font-weight:800;color:#ffdb56;text-align:right}.status.ok{color:#7df6ad}
.signal{border:2px solid #fff;border-radius:10px;padding:10px;text-align:center;background:#a51b25;color:#fff;font-size:clamp(32px,9vw,54px);font-weight:1000;line-height:1.1}
.signal.go{background:#12e779;color:#000}.signal.wait{background:#705000;color:#fff}
.state{text-align:center;font-size:15px;font-weight:850;margin-top:5px}.count{font-size:clamp(90px,30vw,190px);font-weight:1000;color:#ffe600;text-align:center;line-height:1.05;font-variant-numeric:tabular-nums}.count:empty{display:none}
</style></head><body>
<header><h1>KAIROS START</h1><span class="status" id="connection" role="status">SCOLLEGATO</span></header>
<main>
<section><h2>PROSSIMO PETTORALE</h2>
<input id="bib" type="number" inputmode="numeric" min="1" max="99999" placeholder="000" aria-label="Pettorale">
<button id="search" disabled>CERCA ATLETA</button>
<div class="athlete"><div class="label">NOME ATLETA</div><div id="name" class="name" aria-live="polite">—</div><div id="athleteStatus" class="athlete-status">ATTESA PETTORALE</div></div>
<button id="confirm" class="green" disabled>CONFERMA ATLETA</button>
</section>
<section><h2>PARTENZA</h2><div id="signal" class="signal" role="status">STOP</div><div id="state" class="state">ATTESA COLLEGAMENTO</div><div class="count" id="countdown"></div></section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let bib=0,nonce=0,found=false,confirmed=false,confirmPending=false,confirmAt=0,connected=false,link=false,lastPoll=0;
function stopSignal(label){$('signal').className='signal';$('signal').textContent='STOP';$('state').textContent=label;$('countdown').textContent='';}
function controls(){ $('search').disabled=!connected||!link; $('confirm').disabled=!connected||!link||!found||confirmed||confirmPending; }
function clearAthlete(label){bib=0;nonce=0;found=false;confirmed=false;confirmPending=false;$('name').textContent='—';$('athleteStatus').textContent=label;controls();}
function request(action,b,n){if(window.KairosStart)KairosStart.request(action,String(b||''),String(n||''));}
window.KAIROS_ONERROR=function(message){
 $('connection').className='status';$('connection').textContent='SCOLLEGATO';
 connected=false;link=false;clearAthlete('ATTESA COLLEGAMENTO');stopSignal('ATTESA COLLEGAMENTO');
};
window.KAIROS_ONDATA=function(raw){
 let d;try{d=JSON.parse(raw);}catch(_){window.KAIROS_ONERROR('Formato errato');return;}
 if(!d||typeof d.ready!=='boolean'){window.KAIROS_ONERROR('Formato errato');return;}
 lastPoll=Date.now();connected=true;link=d.link_ok===true;
 $('connection').className=link?'status ok':'status';$('connection').textContent=link?'COLLEGATO':'ATTESA FINISH';
 if(!link){clearAthlete('ATTESA FINISH');}
 else if(bib>0&&d.lookup&&Number(d.lookup.nonce)===nonce&&Number(d.lookup.bib)===bib){
  if(d.lookup.status==='found'&&typeof d.lookup.name==='string'&&d.lookup.name.trim()){
   found=true;$('name').textContent=d.lookup.name.slice(0,100);
   $('athleteStatus').textContent=confirmed?'ATLETA CONFERMATO':confirmPending?'CONFERMA IN CORSO':'ATLETA TROVATO';
  }else if(d.lookup.status==='not_found'){
   found=false;confirmed=false;confirmPending=false;$('name').textContent='—';$('athleteStatus').textContent='PETTORALE NON TROVATO';
  }
 }
 if(link&&bib>0&&found){
  if(Number(d.confirmed_bib)===bib&&Number(d.confirmed_nonce)===nonce){confirmed=true;confirmPending=false;$('athleteStatus').textContent='✓ ATLETA CONFERMATO';}
  else if(confirmed){confirmed=false;$('athleteStatus').textContent='ATLETA TROVATO';}
 }
 const states={recall:'RICHIAMO ATLETA',idle:'ATTESA',locked:'ATLETA IN PISTA',ready:'ATTESA VIA LIBERA',countdown:'PREPARARSI',go:'PARTENZA AUTORIZZATA',sent:'PARTENZA TRASMESSA'};
 const go=d.ready===true&&link&&d.stage==='go';
 const countdown=d.ready===true&&link&&d.stage==='countdown';
 const recall=d.ready===true&&link&&d.stage==='recall';
 $('signal').className=go?'signal go':(countdown||recall)?'signal wait':'signal';
 $('signal').textContent=go?'VIA':(countdown||recall)?'ATTENDI':'STOP';
 $('state').textContent=!link?'ATTESA FINISH':!d.ready?'NON PRONTO':(states[d.stage]||'ATTESA FINISH');
 $('countdown').textContent=countdown&&Number.isInteger(d.remaining_sec)&&d.remaining_sec>=0?String(d.remaining_sec):'';
 controls();
};
$('bib').addEventListener('input',()=>clearAthlete('PREMI CERCA ATLETA'));
$('search').onclick=function(){
 if(!connected||!link)return;
 const n=Number($('bib').value);if(!Number.isSafeInteger(n)||n<1||n>99999){alert('Pettorale non valido');return;}
 bib=n;nonce=Date.now()%1000000000||1;found=false;confirmed=false;confirmPending=false;
 $('name').textContent='—';$('athleteStatus').textContent='RICERCA IN CORSO';controls();request('lookup',bib,nonce);$('bib').blur();
};
$('confirm').onclick=function(){
 if(!connected||!link||!found||confirmed||confirmPending)return;
 confirmPending=true;confirmAt=Date.now();controls();$('athleteStatus').textContent='CONFERMA IN CORSO';request('confirm',bib,nonce);
};
setInterval(()=>request('status'),1200);
setInterval(()=>{if(connected&&Date.now()-lastPoll>4000)window.KAIROS_ONERROR('Risposta scaduta');if(confirmPending&&Date.now()-confirmAt>6000){confirmPending=false;$('athleteStatus').textContent='CONFERMA NON RICEVUTA';controls();}},500);
request('status');
})();
</script></body></html>
